<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desk Room Diagram</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#183b38;font:16px system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:28px}h1{margin:0 0 8px;font-size:30px}p{line-height:1.5}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.panel,.drawing{background:white;border:1px solid #d6e1dd;border-radius:16px;padding:20px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,button{font:inherit;padding:8px;border:1px solid #9db5ad;border-radius:6px;max-width:100%;width:100%}button{margin-top:18px;background:#183b38;color:white;cursor:pointer}.metric{font-size:26px;font-weight:700}.note{font-size:13px;color:#506b64}.warn{background:#fff3db;border-left:4px solid #bb7e19;padding:12px;color:#684a19}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:#183b38}.sources{font-size:13px}a{color:#146b60}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #d6e1dd}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:16px}.panel{padding:16px}}@media print{button{display:none}.layout{grid-template-columns:240px 1fr}main{padding:0}}
</style>
<main><h1>Desk Room Diagram</h1><p>Updated room measurements</p><div class="layout"><section class="panel"><label for="side">Sideyard piece length (in)</label><input id="side" type="number" min="25" max="106.8" step="0.5" value="80"><label for="bath">Bathroom piece length (in)</label><input id="bath" type="number" min="25" max="89.6" step="0.5" value="88"><button id="reset">Reset lengths</button><hr><div id="space" class="metric"></div><p>Top-right space remaining</p><div id="status" aria-live="polite"></div></section>
<section class="drawing"><svg id="plan" viewBox="0 0 760 820" role="img" aria-labelledby="title desc"><title id="title">Office floor plan</title><desc id="desc">Bathroom left, Sideyard top, Window right, Closet bottom. Sideyard wall 131.8 inches, Window wall 140.5 inches. Bottom-left projection extends 19 inches from Bathroom wall and 15.5 inches from Closet wall. Desk-side door frame is 89.6 inches from Sideyard. Door frame is 36.1 inches overall with an approximate three-quarter-inch gap to the projection. Lower-corner geometry is schematic.</desc><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e8eeeb"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#146b60"/></marker></defs><g id="scene"></g></svg></section></div>



</main><script>
const $=id=>document.getElementById(id);const room=Object.freeze({w:131.8,h:140.5});const f=n=>Number(n.toFixed(1));
function draw(){let a=Number($('side').value),b=Number($('bath').value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<25||a>106.8||b<25||b>89.6){$('status').textContent='Enter desk runs within the displayed limits.';return}const end=25+a,remain=room.w-end;const X=n=>100+n*4,Y=n=>130+n*4;
$('space').textContent=f(remain)+' in';$('status').textContent='';
$('scene').innerHTML=`<text x="388" y="30" text-anchor="middle" font-size="20" font-weight="700">Sideyard wall · 131.8 in</text><text x="388" y="780" text-anchor="middle" font-size="20" font-weight="700">Closet wall · 112.8 in</text><text transform="translate(30 394) rotate(-90)" text-anchor="middle" font-size="20" font-weight="700">Bathroom wall · 125.9 in</text><text transform="translate(719 410) rotate(90)" text-anchor="middle" font-size="20" font-weight="700">Window wall · 140.5 in</text><path id="room-outline" d="M100 130H${X(room.w)}V${Y(room.h)}H${X(19)}V${Y(126.45)}H100Z" fill="url(#grid)" stroke="#183b38" stroke-width="4"/><rect id="corner-projection" x="100" y="${Y(126.45)}" width="76" height="${(room.h-126.45)*4}" fill="#d8dddc"/><path d="M100 ${Y(126.45)}H${X(19)}V${Y(room.h)}" fill="none" stroke="#183b38" stroke-width="4"/><rect x="${X(end)}" y="130" width="${remain*4}" height="100" fill="#d9eee6"/><g id="bath-span"><path d="M77 130V${Y(89.6)}M71 130H83M71 ${Y(89.6)}H83" fill="none" stroke="#647773" stroke-width="1"/><text transform="translate(68 ${Y(89.6/2)}) rotate(-90)" text-anchor="middle" font-size="14">89.6 in</text></g><g id="window"><path d="M${X(room.w)} ${Y(34.8)}V${Y(105)}" stroke="white" stroke-width="8"/><rect x="${X(room.w)-4}" y="${Y(34.8)}" width="8" height="${70.2*4}" fill="#e0f0f7" stroke="#4f829d" stroke-width="1.5"/><path d="M${X(room.w)} ${Y(34.8)}V${Y(105)}M${X(room.w)-6} ${Y(69.9)}H${X(room.w)+6}" stroke="#4f829d" stroke-width="1.5"/><path d="M651 130V${Y(room.h)}M645 130H657M645 ${Y(34.8)}H657M645 ${Y(105)}H657M645 ${Y(room.h)}H657" fill="none" stroke="#647773" stroke-width="1"/><text transform="translate(669 ${Y(17.4)}) rotate(90)" text-anchor="middle" font-size="13">34.8 in</text><text transform="translate(669 ${Y(69.9)}) rotate(90)" text-anchor="middle" font-size="14">Window · 70.2 × 40 in</text><text transform="translate(669 ${Y(122.75)}) rotate(90)" text-anchor="middle" font-size="13">35.5 in</text></g><g id="door-area"><path d="M100 ${Y(89.6)}V${Y(125.7)}" stroke="#e7def0" stroke-width="9"/><path d="M100 ${Y(92.3)}V${Y(123)}" stroke="white" stroke-width="8"/><path d="M100 ${Y(123)}H${X(30.7)}" stroke="#6b4d83" stroke-width="3"/><path d="M100 ${Y(92.3)}A122.8 122.8 0 0 1 ${X(30.7)} ${Y(123)}" fill="#bba6ce" fill-opacity=".12" stroke="#8c73a2" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M91 ${Y(89.6)}H109M91 ${Y(125.7)}H109" stroke="#6b4d83" stroke-width="2"/></g><rect id="bath-piece" x="100" y="130" width="100" height="${b*4}" fill="#dfbf91" stroke="#937044" stroke-width="2"/><rect id="side-piece" x="200" y="130" width="${a*4}" height="100" fill="#edd3af" stroke="#937044" stroke-width="2"/><g id="inside-bath-span"><path d="M214 230V${Y(b)}M208 230H220M208 ${Y(b)}H220" fill="none" stroke="#647773" stroke-width="1"/><text transform="translate(234 ${Y((25+b)/2)}) rotate(-90)" text-anchor="middle" font-size="14">${f(b-25)} in</text></g><path d="M200 130V230" stroke="#63482e" stroke-width="3" stroke-dasharray="5 3"/><rect id="corner-square" x="100" y="130" width="100" height="100" fill="none" stroke="#63482e" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="2 4" pointer-events="none"/><text x="${X(25+a/2)}" y="188" text-anchor="middle" font-size="17">Sideyard piece · ${f(a)} × 25 in</text><text transform="translate(157 ${Y((25+b)/2)}) rotate(-90)" text-anchor="middle" font-size="17">Bathroom piece · ${f(b)} × 25 in</text><path d="M${X(end)} 118V68M${X(room.w)} 118V68M${X(end)+3} 80H${X(room.w)-3}" fill="none" stroke="#146b60" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="${X((end+room.w)/2)}" y="59" text-anchor="middle" font-size="15" font-weight="700">${f(remain)} in remaining</text><text x="350" y="400" text-anchor="middle" font-size="22" fill="#657d75"></text><path d="M100 742H196" stroke="#183b38" stroke-width="3"/><text x="148" y="765" text-anchor="middle" font-size="14">24 in scale</text>`;
}
['side','bath'].forEach(id=>$(id).addEventListener('input',draw));$('reset').onclick=()=>{$('side').value=80;$('bath').value=88;draw()};draw();
</script></html>
